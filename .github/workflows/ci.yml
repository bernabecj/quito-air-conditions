name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    lint-and-test:
        name: Lint & Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            - name: Cache virtualenv
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

            - name: Install dependencies
              run: poetry install --with dev

            # Poetry keeps the virtualenv in-project (poetry.toml), so commands run
            # from it directly, the same way they do locally with .venv activated.
            - name: Put the virtualenv on PATH
              run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

            - name: Check formatting
              run: |
                  black --check .
                  isort --check-only .

            # Tests must run without network or an API key. Exit code 5 means
            # "no tests collected", accepted until the first test lands in tests/.
            - name: Run pytest
              run: pytest || [ $? -eq 5 ]
